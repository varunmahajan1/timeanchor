[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timeanchor"
version = "0.1.0"
description = "Deterministic time grounding for LLM prompts — precomputed date anchors + resolve-in-code datetimes, stdlib only"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["llm", "ai", "prompt", "datetime", "timezone", "scheduling", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/varunmahajan1/timeanchor"
Issues = "https://github.com/varunmahajan1/timeanchor/issues"
